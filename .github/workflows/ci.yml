# Build, lint, and the database authorization tests that SRS §8.2 makes a
# release gate. The DB job runs the real migrations against a real PostgreSQL,
# so a broken policy or a changed calculation fails here rather than in UAT.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Build & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Static export must succeed
        run: npm run build
      - name: Fail if the export is empty
        run: test -f out/index.html && test -f out/login/index.html

  database:
    name: Database authorization & calculations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ensure psql is available
        run: psql --version || sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Run the suite
        env:
          PSQL: psql postgresql://postgres:pg@localhost:5432/postgres
          PGPASSWORD: pg
        run: node scripts/db-test.mjs
