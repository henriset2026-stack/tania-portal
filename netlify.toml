# Netlify build configuration for TANIA.
# Referenced by README.md and docs/TANIA_StepByStep_ClaudeCode.md Step 8.
#
# Credit discipline (SAD AD-9): Netlify Free gives 300 credits/month and one
# production deploy costs 15. Deploy Previews and branch deploys must be
# turned OFF in the UI — Project configuration → Build & deploy → Continuous
# deployment. netlify.toml cannot disable them; only the UI setting can.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Next.js fingerprints filenames under /_next/static, so they are safe to
# cache forever. Everything else must revalidate.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
